<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Reserve — book</title>
<style>
:root{--bg:#08090b;--edge:#1b1f24;--dim:#7c858f;--txt:#e9eef4;--ok:#3ddc97;--no:#ff5d5d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;padding:34px 38px}
h1{font-size:15px;letter-spacing:.32em;font-weight:600;color:var(--dim)}
h1 b{color:var(--txt)}
.sub{color:var(--dim);font-size:12px;margin-top:6px}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-top:26px}
.card{border:1px solid var(--edge);border-radius:12px;padding:20px 22px;background:#0b0d10}
.k{color:var(--dim);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.v{font-size:38px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--edge)}
.row:last-child{border-bottom:0}
.bar{height:10px;border-radius:6px;background:#12161a;overflow:hidden;display:flex;margin-top:14px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:18px;margin-top:10px;font-size:12px;color:var(--dim)}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px}
.feed{margin-top:26px}
.ev{display:grid;grid-template-columns:78px 1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--edge);font-size:13px;align-items:center}
.tag{font-size:10px;letter-spacing:.1em;padding:3px 7px;border-radius:5px;text-align:center}
.tag.ok{background:rgba(61,220,151,.13);color:var(--ok);border:1px solid rgba(61,220,151,.3)}
.tag.no{background:rgba(255,93,93,.12);color:var(--no);border:1px solid rgba(255,93,93,.28)}
a{color:#8ab4ff;text-decoration:none}
.foot{margin-top:22px;color:var(--dim);font-size:11px}
</style></head><body>
<h1><b>RESERVE</b> &nbsp;/ book</h1>
<div class="sub" id="chain">reading Base Sepolia…</div>

<div class="grid">
  <div class="card">
    <div class="k">Book value</div><div class="v" id="book">—</div>
    <div class="bar"><i id="bStock" style="background:#8ab4ff;width:0"></i><i id="bCash" style="background:#3ddc97;width:0"></i></div>
    <div class="legend"><span><span class="dot" style="background:#8ab4ff"></span>tokenized stock <b id="stock">—</b></span>
    <span><span class="dot" style="background:#3ddc97"></span>liquid USDC <b id="liquid">—</b></span></div>
    <div class="row" style="margin-top:16px"><span class="k">Operating reserve floor</span><span id="floor">—</span></div>
    <div class="row"><span class="k">Headroom above floor</span><span id="head">—</span></div>
    <div class="row"><span class="k">Debt</span><span id="debt">—</span></div>
  </div>
  <div class="card">
    <div class="k">Market state</div>
    <div class="row"><span class="k">Ticker</span><span id="sym">—</span></div>
    <div class="row"><span class="k">Price</span><span id="px">—</span></div>
    <div class="row"><span class="k">Corporate action</span><span id="paused">—</span></div>
    <div class="row"><span class="k">Multiplier</span><span id="mult">—</span></div>
    <div class="row"><span class="k">Feed age</span><span id="age">—</span></div>
    <div class="row"><span class="k">Guard verdict</span><span id="verdict">—</span></div>
  </div>
</div>

<div class="feed">
  <div class="k" style="margin-bottom:8px">Guard ledger — every intent, approved or refused</div>
  <div id="events"></div>
</div>
<div class="foot" id="foot"></div>
<script type="module">
const s = await (await fetch("./state.json", {cache:"no-store"})).json();
const m = (v) => "$" + v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const el = (id) => document.getElementById(id);
el("book").textContent = m(s.bookUsd);
el("stock").textContent = m(s.stockUsd);
el("liquid").textContent = m(s.liquidUsd);
el("floor").textContent = m(s.floorUsd);
el("head").textContent = m(Math.max(0, s.liquidUsd - s.floorUsd));
el("debt").textContent = m(s.debtUsd);
el("bStock").style.width = (100*s.stockUsd/(s.bookUsd||1))+"%";
el("bCash").style.width = (100*s.liquidUsd/(s.bookUsd||1))+"%";
el("sym").textContent = s.symbol + " (mock B20)";
el("px").textContent = "$"+s.price.toFixed(2)+" / share";
el("paused").textContent = s.paused ? "PAUSED":"none";
el("paused").style.color = s.paused ? "var(--no)":"var(--ok)";
el("mult").textContent = s.multiplier.toFixed(4)+(s.multiplierPending?" (pending)":"");
const stale = s.feedAgeSec > 86400;
el("age").textContent = stale ? Math.floor(s.feedAgeSec/3600)+"h — STALE" : Math.floor(s.feedAgeSec/60)+"m";
el("age").style.color = stale ? "var(--no)":"var(--txt)";
const safe = !s.paused && !stale && !s.multiplierPending;
el("verdict").textContent = safe ? "allow" : "refuse: " + (s.paused?"PAUSED_CORPORATE_ACTION":stale?"FEED_STALE":"MULTIPLIER_PENDING");
el("verdict").style.color = safe ? "var(--ok)":"var(--no)";
el("chain").textContent = s.chain+" · vault "+s.vault.slice(0,10)+"… · guard "+s.guard.slice(0,10)+"…";
el("events").innerHTML = s.events.slice().reverse().map(e => `
  <div class="ev"><span class="tag ${e.refused?"no":"ok"}">${e.refused?"REFUSED":"APPROVED"}</span>
  <span>${e.refused ? e.reason : "buy settled · "+e.amountUsd.toFixed(2)+" USDC"}<br>
  <span style="color:var(--dim);font-size:11px">block ${e.block} · tx ${e.tx.slice(0,18)}…</span></span>
  <a href="https://sepolia.basescan.org/tx/${e.tx}" target="_blank">basescan ↗</a></div>`).join("");
el("foot").textContent = `snapshot · ${s.totalIntents} intents onchain · ${s.refusedCount} refused · stock leg is a mock B20 (no B20 exists on any testnet) · prices from a mock oracle`;
</script></body></html>
